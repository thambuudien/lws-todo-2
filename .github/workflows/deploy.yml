name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4 # Nâng cấp lên v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Nâng cấp lên v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Create .env file
        run: |
          echo "GRAPHQL_URI=${{ secrets.GRAPHQL_URI }}" > .env
          echo "LWS_SECRET_TOKEN=${{ secrets.LWS_SECRET_TOKEN }}" >> .env
          echo "LWS_HOTHAM_SECRET_TOKEN=${{ secrets.LWS_HOTHAM_SECRET_TOKEN }}" >> .env

      - name: Install Dependencies 👨‍💻
        run: npm ci

      - name: Build 🏗️
        run: npx quasar build -m pwa

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4 # Nâng cấp lên v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/pwa
