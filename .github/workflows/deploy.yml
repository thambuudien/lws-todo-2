name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Hoặc nhánh chính của bạn

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18" # Phù hợp với phiên bản Node.js bạn đang dùng

      - name: Create .env file
        run: |
          echo "GRAPHQL_URI=${{ secrets.GRAPHQL_URI }}" > .env
          echo "LWS_SECRET_TOKEN=${{ secrets.LWS_SECRET_TOKEN }}" >> .env
          echo "LWS_HOTHAM_SECRET_TOKEN=${{ secrets.LWS_HOTHAM_SECRET_TOKEN }}" >> .env

      - name: Install Dependencies 👨‍💻
        run: npm install

      - name: Build 🏗️
        run: quasar build -m pwa

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/pwa
