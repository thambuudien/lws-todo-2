      :root {
        --navy: #0f2a4d;
        --navy-2: #123f68;
        --blue: #1e6feb;
        --blue-2: #2196f3;
        --brand: #1e6feb;
        --teal: #00b8a9;
        --teal-dark: #008f84;
        --purple: #7c4dff;
        --app-blue: #2196f3;
        --yellow: #ffc857;
        --yellow-soft: #fff3d1;
        --surface: #ffffff;
        --surface-2: #f4f7fa;
        --surface-3: #eaf2f1;
        --ink: #0f2a4d;
        --muted: #5e7186;
        --line: #dde7ee;
        --red: #e94f4f;
        --green: #149d72;
      }

      /* FIX DARK MODE - ANLO: khóa luôn Light Mode.
   Lỗi cũ: block @media dark bên dưới đổi --surface thành navy đậm #0b2a4a

   nên chữ navy chìm trên nền navy, chữ trắng chìm trên nền trắng. */
      html {
        color-scheme: light only;
      }
      :root {
        color-scheme: light only;
      }
      /* Đã XÓA block @media (prefers-color-scheme: dark) cũ - không cho trình duyệt tự đổi nền. */

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Be Vietnam Pro", system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--surface-2);
        color: var(--ink);
      }

      a {
        color: inherit;
      }

      button {
        font: inherit;
      }

      ::-moz-selection {
        background: var(--yellow);
        color: var(--navy);
      }

      ::selection {
        background: var(--yellow);
        color: var(--navy);
      }

      .container-x {
        width: min(1180px, calc(100% - 40px));
        margin-inline: auto;
      }

      .card-shadow {
        box-shadow: 0 18px 45px rgba(11, 42, 74, 0.1);
      }

      .soft-shadow {
        box-shadow: 0 10px 28px rgba(11, 42, 74, 0.08);
      }

      .brand-gradient {
        background: linear-gradient(135deg, #1e6feb 0%, #00b8a9 100%);
      }

      .brand-gradient-soft {
        background: linear-gradient(
          135deg,
          rgba(30, 111, 235, 0.12),
          rgba(0, 184, 169, 0.12)
        );
      }

      .brand-text {
        background: linear-gradient(135deg, #1e6feb, #00b8a9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .app-header {
        background: #2196f3;
      }

      .logo-bell {
        background: linear-gradient(135deg, #1e6feb, #00b8a9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.97);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(16px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .rise {
        animation: rise 0.7s ease both;
      }

      .rise-2 {
        animation: rise 0.7s 0.12s ease both;
      }

      .rise-3 {
        animation: rise 0.7s 0.22s ease both;
      }

      .floaty {
        animation: floaty 4.5s ease-in-out infinite;
      }

      .pop {
        animation: pop 0.35s ease both;
      }

      .toast-in {
        animation: toastIn 0.3s ease both;
      }

      .faq-body {
        transition: max-height 0.35s ease, opacity 0.3s ease;
      }

      .chip-active {
        background: var(--navy) !important;
        color: white !important;
        border-color: var(--navy) !important;
      }

      input:focus,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(0, 184, 169, 0.35);
        outline-offset: 2px;
      }

      @media (max-width: 640px) {
        .container-x {
          width: min(1180px, calc(100% - 32px));
